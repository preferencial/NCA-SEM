
<script id="up-oracular-form-feedback">
(function () {
  'use strict';
  if (window.UpOracularFeedback) return;

  var timer = null;
  function notify(kind, message) {
    var box = document.getElementById('uo-feedback-box');
    if (!box) {
      box = document.createElement('div');
      box.id = 'uo-feedback-box';
      box.className = 'uo-feedback-box';
      box.setAttribute('role', 'status');
      box.setAttribute('aria-live', 'polite');
      document.body.appendChild(box);
    }
    box.dataset.kind = kind === 'err' ? 'err' : 'ok';
    box.textContent = String(message || (kind === 'err' ? 'Nao foi possivel concluir.' : 'Operacao concluida.'));
    box.classList.add('is-visible');
    clearTimeout(timer);
    timer = setTimeout(function () {
      box.classList.remove('is-visible');
    }, 1000);
  }

  function connectLabels(form) {
    form.querySelectorAll('input:not([type="hidden"]), select, textarea').forEach(function (field, index) {
      var id = field.id || ('uo-field-' + index + '-' + Math.random().toString(36).slice(2, 7));
      field.id = id;
      var label = form.querySelector('label[for="' + id + '"]');
      if (!label) {
        var sibling = field.previousElementSibling;
        if (sibling && sibling.tagName === 'LABEL') {
          sibling.htmlFor = id;
          label = sibling;
        }
      }
      if (label && field.parentElement && !field.parentElement.classList.contains('uo-field')) {
        field.parentElement.classList.add('uo-field');
      }
    });
  }

  document.addEventListener('DOMContentLoaded', function () {
    document.querySelectorAll('form').forEach(connectLabels);
  });

  document.addEventListener('submit', function (event) {
    var form = event.target;
    if (!form || form.tagName !== 'FORM') return;
    form.setAttribute('aria-busy', 'true');
    notify('ok', 'Enviando...');
    window.setTimeout(function () {
      if (form.getAttribute('aria-busy') === 'true') {
        form.removeAttribute('aria-busy');
      }
    }, 10000);
  }, true);

  window.UpOracularFeedback = {
    ok: function (message) { notify('ok', message); },
    err: function (message) { notify('err', message); },
    done: function (form, message) {
      if (form) form.removeAttribute('aria-busy');
      notify('ok', message);
    },
    fail: function (form, message) {
      if (form) form.removeAttribute('aria-busy');
      notify('err', message);
    }
  };
}());
</script>

<script>
/**
 * codex-frontend-backend-healthcheck
 * Selo visivel que torna evidente a integracao frontend<->backend.
 *
 * Aditivo e isolado:
 *  - cria seu proprio elemento (nao depende de nenhum container do app);
 *  - usa o wrapper padronizado ClientCall para chamar o metodo backend ping();
 *  - degrada em silencio (pointer-events:none, nunca bloqueia a UI).
 */
(function () {
  function mount() {
    if (document.getElementById('codex-backend-status')) {
      return document.getElementById('codex-backend-status');
    }
    var el = document.createElement('div');
    el.id = 'codex-backend-status';
    el.setAttribute('role', 'status');
    el.setAttribute('aria-live', 'polite');
    el.setAttribute('title', 'Estado da conexao com o backend');
    el.className = 'uo-health-badge';
    el.textContent = '◌ backend...';
    (document.body || document.documentElement).appendChild(el);
    return el;
  }

  function set(el, color, text) {
    if (!el) { return; }
    el.className = 'uo-health-badge';
    if (color === '#16a34a') el.classList.add('uo-health-badge--ok');
    else if (color === '#dc2626') el.classList.add('uo-health-badge--down');
    else if (color === '#b45309') el.classList.add('uo-health-badge--warn');
    el.textContent = text;
  }

  function ok(el) { set(el, '#16a34a', '● backend conectado'); }
  function down(el) { set(el, '#dc2626', '● backend offline'); }

  function check(el) {
    // Caminho preferencial: wrapper padronizado (Promise + retry + StandardReturn).
    if (window.ClientCall && typeof ClientCall.call === 'function') {
      ClientCall.call('ping', [], { retries: 1 })
        .then(function () { ok(el); })
        .catch(function () { down(el); });
      return;
    }
    // Fallback: paginas servidas via createHtmlOutputFromFile (sem include scriptlet)
    // nao carregam o ClientCall; usamos google.script.run cru direto.
    if (window.google && google.script && google.script.run) {
      google.script.run
        .withSuccessHandler(function () { ok(el); })
        .withFailureHandler(function () { down(el); })
        .ping();
      return;
    }
    set(el, '#b45309', '⚠ backend indisponivel');
  }

  function init() { check(mount()); }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
  } else {
    init();
  }
})();
</script>
